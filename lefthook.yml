pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    type-check:
      run: bun run type-check
    test:
      run: bun run test
commit-msg:
  commands:
    conventional:
      run: |
        if ! grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: ' "{1}"; then
          echo "mensagem fora do padrão Conventional Commits"
          exit 1
        fi
